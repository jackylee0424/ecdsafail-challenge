CONSTANTS
    N = 8
    Q = 256
    P = 239
    C = 17
    CHi = 4
    CarryWindow = 2
    PeakLimit = 16
    TargetOperation = "double"
    TargetConstantForm = "sparse_c"
    TargetControlModel = "direct_controlled"
    TargetCarryModel = "truncated_window"
    TargetCleanupModel = "measured_hmr"
    TargetHostModel = "fresh"
    Q1175DirtyQoffset = FALSE
    Q1175BorrowCleanedBoundary = FALSE
    Q1175BorrowFutureBoundary = FALSE
    Q1175StreamFoldControls = FALSE
    Q1175ApplyBlocks = 2
    Q1175CleanCompareBits = 20
    Q1175FoldParkLow = 7
    Q1175SpecialFoldParkLow = 5

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT ValueCorrect
INVARIANT ScratchCleanWhenDone
INVARIANT PeakEnvelope
INVARIANT Q1175LifecycleSafe

\* Enable this only when checking a key/window that is intended to be exact for
\* all toy-model states. For lossy-island route rows, blocked progress is the
\* expected signal when the carry-tail guard is false.
\* INVARIANT GuardedProgress
